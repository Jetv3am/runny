# Alembic CLI config. The app migrates itself at startup; use this only to author revisions:
#   uv run alembic revision --autogenerate -m "describe the change"
# The database URL comes from coach.config (COACH_DATABASE_URL / COACH_DATA_DIR).
[alembic]
script_location = coach:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
